<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Проверка игры</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#c9f4ff,#eee1ff 55%,#ffe1ef);font-family:Arial,sans-serif;color:#30285c}.card{width:min(420px,calc(100% - 32px));background:#fffc;border:3px solid white;border-radius:28px;padding:32px;text-align:center;box-shadow:0 18px 45px #594c9928}.star{font-size:64px}h1{font-size:30px;margin:10px 0}p{font-size:17px;line-height:1.45}button{border:0;border-radius:18px;padding:16px 25px;background:#7357e8;color:white;font-size:18px;font-weight:bold;box-shadow:0 7px 0 #4f3caf;cursor:pointer}button:active{transform:translateY(5px);box-shadow:0 2px 0 #4f3caf}.ok{display:none;margin-top:24px;padding:15px;border-radius:15px;background:#d8faeb;color:#08734d;font-weight:bold}.ok.show{display:block}
  </style>
</head>
<body><main class="card"><div class="star">⭐</div><h1>Проверка игры</h1><p>Нажми на кнопку. Если появится зелёное сообщение, игры будут работать на этом телефоне.</p><button id="test">Нажми меня</button><div class="ok" id="ok">Всё работает! 🎉</div></main><script>document.getElementById('test').onclick=()=>document.getElementById('ok').classList.add('show')</script></body>
</html>
